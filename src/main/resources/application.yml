server:
  port: ${PORT:8080}

spring:
  application:
    name: spring-api
  profiles:
    active: ${APP_ENV:development}

  # MongoDB - document data
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cdac_db}

  # PostgreSQL (+ PostGIS) - main database. This service owns the `auth` schema.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cdac_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway creates and migrates the `auth` schema (src/main/resources/db/migration).
  # express-api's `app` schema references auth.users, so this must run first.
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Schema changes go through Flyway; Hibernate only checks the mapping.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Outgoing email (password reset, email verification). Mailpit locally.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  # JWT contract shared with express-api: HS256 over JWT_SECRET,
  # claims sub (user id), email, name, role, iss, aud, iat, exp.
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:cdac-auth}
    audience: ${JWT_AUDIENCE:cdac-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

  mail:
    from: ${MAIL_FROM:MediCare <no-reply@cdac.local>}
    # Base URL of the web app, for links in emails (reset password, verify email)
    app-base-url: ${APP_BASE_URL:http://localhost:3000}

  # First-boot admin account (created only if no ADMIN exists). See config/AdminSeeder.
  seed-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
